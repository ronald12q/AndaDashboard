# Instalar dentro del contexto http. Sustituir dominio y rutas TLS antes de habilitar.
server {
    listen 80;
    server_name anda.example.org;
    return 308 https://anda.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name anda.example.org;
    ssl_certificate /etc/letsencrypt/live/anda.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anda.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/anda/frontend/dist;
    index index.html;
    client_max_body_size 5m;

    # La comprobación de base de datos queda en localhost para el operador.
    location ~* ^/api/health/db/?$ { return 404; }
    location = /api { return 404; }

    location /api/ {
        # Los parámetros de carga incluyen nombres de archivos; los de búsqueda, NIS.
        access_log off;
        # No usar $proxy_add_x_forwarded_for: el cliente no puede aportar su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
